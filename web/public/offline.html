<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b21">
  <title>Offline · Chat Reader</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #0b141a; color: #e9edef; text-align: center;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #aebac1; margin: 0 0 20px; }
    button {
      background: #25d366; color: #06281a; border: 0; border-radius: 999px;
      padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Chat Reader needs a connection to load your chats.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
